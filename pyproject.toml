[project]
name = "lossless-yaml"
version = "0.1.0"
description = "Byte-for-byte preserving YAML editor for programmatic modifications"
authors = [
    { name = "Ryan Williams", email = "ryan@no.de" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ruamel.yaml>=0.17.0",
]
license = { text = "MIT" }
keywords = ["yaml", "lossless", "editor", "round-trip", "formatting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/neighbor-ryan/lossless-yaml"
Repository = "https://github.com/neighbor-ryan/lossless-yaml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lossless_yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
